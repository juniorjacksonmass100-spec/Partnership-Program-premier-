name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Inaruhusu kuendesha workflow mwenyewe kwa kubofya kitufe 'Run workflow' kwenye GitHub Actions

jobs:
  build-apk:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Production Environment Variables
        run: |
          echo "Setting up Supabase environment for build..."
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            URL="${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}"
            KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}"
            echo "VITE_SUPABASE_URL=$URL" > .env.production
            echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production
            echo "VITE_SUPABASE_URL=$URL" > .env
            echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env
            echo "Supabase secrets injected into build environment."
          fi

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
        run: npm run build

      - name: Initialize Capacitor Android if not present
        run: |
          if [ ! -d "android" ]; then
            echo "Inatengeneza mradi wa Android..."
            npx cap add android
          fi
          npx cap sync android

      - name: Ensure Persistent Keystore for Smooth Updates
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating persistent signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jerusalem Ministry, OU=Mobile, O=Jerusalem Ministry of Gospel, L=Dar es Salaam, ST=Dar es Salaam, C=TZ"
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerusalem-Ministry-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
